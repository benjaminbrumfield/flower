<!doctype html>
<!--
  flower: a quiet focus timer in one file. Open it straight from disk; no server.
  Sessions are kept in this browser's local storage ("flower.sessions") and can be
  downloaded as a CSV with the "export" link above the 8-hour strip.
  Each time the dial comes back it wears one of three looks, picked at random:
  Line, Lantern or Tone (Tone in one of four colours). Their fonts come from
  Google Fonts; offline, each look falls back to a system font.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111214">
<title>flower</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-32 -32 64 64'><defs><linearGradient id='g' gradientUnits='userSpaceOnUse' x1='0' y1='-4' x2='0' y2='-30'><stop offset='0' stop-color='%23c48a48'/><stop offset='1' stop-color='%23f0b46a'/></linearGradient><path id='p' d='M0,-4 C7,-9 11,-25 0,-30 C-11,-25 -7,-9 0,-4 Z'/></defs><g fill='url(%23g)'><use href='%23p'/><use href='%23p' transform='rotate(60)'/><use href='%23p' transform='rotate(120)'/><use href='%23p' transform='rotate(180)'/><use href='%23p' transform='rotate(240)'/><use href='%23p' transform='rotate(300)'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,400&family=IBM+Plex+Mono:wght@300;400&family=Space+Grotesk:wght@300;400;500&display=swap" media="print" onload="this.media='all'">
<style>
:root {
  --ease: cubic-bezier(.4, 0, .2, 1);
}

/* ---- the looks: one is picked at random each time the dial comes back ---- */

/* Line: each petal is one drawn stroke that unwinds as its minutes pass */
body[data-look="line"] {
  --bg: #111214;
  --ink: #ECE7DD;
  --muted: #8C877E;
  --hair: #2A2B2F;             /* the history strip's baseline and ticks */
  --tip: #1C1D21;
  --idle-petals: .75;          /* the preview while choosing */
  --ghost: .14;                /* petal outlines: idle, chosen, set aside */
  --ghost-on: .32;
  --ghost-off: .06;
  --icon-a: #C48A48;           /* tab icon, petal base → tip */
  --icon-b: #F0B46A;
  font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  font-weight: 300;
}

/* Lantern: slender flame petals with a soft halo that flickers slowly */
body[data-look="lantern"] {
  --bg: #0C0B10;
  --ink: #F3DDBF;
  --muted: #9A8E80;
  --time-run: #A89A8A;
  --hair: rgb(255 184 105 / .12);
  --tip: #18141A;
  --idle-petals: .7;
  --ghost: .09;
  --ghost-on: .24;
  --ghost-off: .035;
  --icon-a: #FF8F45;
  --icon-b: #FFE6BC;
  font-family: "Cormorant Garamond", Garamond, Georgia, serif;
  font-weight: 500;
}

/* Tone: a colour field, round daisy petals tone on tone, a big quiet clock */
body[data-look="tone"] {
  --hair: rgb(0 0 0 / .2);
  --tip: color-mix(in srgb, var(--bg), #000 32%);
  --idle-petals: .9;
  --ghost: .11;
  --ghost-on: .22;
  --ghost-off: .05;
  font-family: "Space Grotesk", system-ui, sans-serif;
  font-weight: 400;
}
/* one ground colour; everything else is a pale tone of it */
body[data-palette="moss"] { --bg: #3F5B4A; --lit: #DDE7D0; --muted: #CAD5C3; --ink: #F1F5EC; --icon-a: #6E9079; --icon-b: #DDE7D0; }
body[data-palette="clay"] { --bg: #7A3F2E; --lit: #F2D6C6; --muted: #E9C9B8; --ink: #FBEFE8; --icon-a: #B8664C; --icon-b: #F2D6C6; }
body[data-palette="dusk"] { --bg: #2F3E63; --lit: #D3DBF0; --muted: #C2CBE3; --ink: #EEF1FA; --icon-a: #6276AC; --icon-b: #D3DBF0; }
body[data-palette="plum"] { --bg: #553049; --lit: #EDD3E2; --muted: #E2C6D7; --ink: #F8ECF3; --icon-a: #9A5F86; --icon-b: #EDD3E2; }

/* changing looks crossfades the whole page */
::view-transition-old(root),
::view-transition-new(root) { animation-duration: .8s; }

* { box-sizing: border-box; }

html, body { height: 100%; margin: 0; }

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background-color: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

main {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding-top: 4vh;
}

/* ---- the flower ---- */

#flower {
  width: min(90vw, 62vh, 540px);
  height: auto;
  overflow: visible;
}

#bloom {
  animation: breathe 10s ease-in-out infinite;
  transition: opacity 1.4s var(--ease);
}
body[data-look="line"] #bloom { animation: none; }   /* Line holds still */
@keyframes breathe {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.022); }
}
body[data-phase="paused"] #bloom { animation-play-state: paused; opacity: .34; }

/* all twelve petals, faintly; during a session the chosen length stays
   stronger behind the lit petals and the rest recede */
#ghosts path {
  fill-opacity: var(--ghost);
  stroke-opacity: var(--ghost);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
  transition: fill-opacity .9s var(--ease), stroke-opacity .9s var(--ease);
}
body:not([data-phase="idle"]) #ghosts path.chosen {
  fill-opacity: var(--ghost-on);
  stroke-opacity: var(--ghost-on);
}
body:not([data-phase="idle"]) #ghosts path:not(.chosen) {
  fill-opacity: var(--ghost-off);
  stroke-opacity: var(--ghost-off);
}
body[data-look="line"] #ghosts path    { fill: none; stroke: var(--ink); }
body[data-look="lantern"] #ghosts path { fill: none; stroke: #FFB869; }
body[data-look="tone"] #ghosts path    { fill: #000; stroke: none; }

/* the lit petals: a preview while choosing, a full bloom once a session is chosen */
#petals,
#halo { transition: opacity 1.2s var(--ease); }
body[data-phase="idle"] #petals,
body[data-phase="idle"] #halo { opacity: var(--idle-petals); }

body[data-look="line"] #petals path {
  fill: none;
  stroke: var(--ink);
  stroke-width: 1.3;           /* scales with the flower, so the dash lengths stay true */
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: var(--dash) var(--dash);
  transition: stroke .6s;
}
/* the petal now counting down is the one amber line */
body[data-look="line"]:is([data-phase="running"], [data-phase="paused"]) #petals path.partial { stroke: #F0B46A; }
body[data-look="lantern"] #petals path { fill: url(#lantern-fill); }
body[data-look="tone"] #petals path    { fill: var(--lit); }

/* Lantern's glow: a blurred copy of the lit petals behind them */
#halo { display: none; }
body[data-look="lantern"] #halo { display: inline; }
#halo path   { fill: #FF9A4D; }
#halo circle { fill: #FFD9A8; }
.flicker { opacity: .65; animation: flicker 7s ease-in-out infinite; }
body[data-phase="paused"] .flicker { animation-play-state: paused; }
@keyframes flicker {
  0%, 100% { opacity: .55; }
  35%      { opacity: .78; }
  60%      { opacity: .6; }
  80%      { opacity: .7; }
}

body[data-look="line"] #heart {
  fill: none;
  stroke: var(--ink);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
  opacity: .6;
}
body[data-look="lantern"] #heart { fill: #FFF4E2; }
body[data-look="tone"] #heart    { fill: var(--lit); }

/* ---- presets: the numbers around the flower ---- */

.preset { cursor: pointer; outline: none; transition: opacity .7s var(--ease); }
.preset .hit { fill: transparent; }
.preset text {
  fill: var(--muted);
  text-anchor: middle;
  dominant-baseline: central;
  font-variant-numeric: tabular-nums;
  transition: fill .35s var(--ease), fill-opacity .35s var(--ease);
}
.preset:hover text,
.preset:focus-visible text { fill: var(--ink); }

body[data-look="line"] .preset text { font-size: 11px; font-weight: 400; letter-spacing: .08em; }

body[data-look="lantern"] .preset text { font-size: 17px; font-weight: 500; }
body[data-look="lantern"] .preset:hover text,
body[data-look="lantern"] .preset:focus-visible text { fill: #FBE9D0; filter: url(#ember); }

body[data-look="tone"] .preset text { font-size: 12.5px; font-weight: 500; fill: var(--ink); fill-opacity: .78; }
body[data-look="tone"] .preset:hover text,
body[data-look="tone"] .preset:focus-visible text { fill-opacity: 1; }

body:not([data-phase="idle"]) .preset { opacity: 0; pointer-events: none; }

/* ---- countdown and remaining time ---- */

#readout {
  display: grid;
  place-items: center;         /* tucked into the space the bottom numbers leave */
}
#readout > span {
  grid-area: 1 / 1;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

#count {
  color: var(--muted);
  opacity: 0;
}
#count.beat { animation: beat 1s var(--ease) both; }
@keyframes beat {
  0%   { opacity: 0; transform: scale(.94); }
  35%  { opacity: 1; transform: scale(1); }
  72%  { opacity: 1; }
  100% { opacity: 0; transform: scale(1.03); }
}

#time {
  color: var(--ink);
  opacity: 0;
  transition: opacity 1.4s var(--ease), color 1s var(--ease);
}
body[data-phase="running"] #time { color: var(--time-run, var(--muted)); }
body:is([data-phase="running"], [data-phase="paused"], [data-phase="done"]) #time { opacity: 1; }

body[data-look="line"] #readout { height: 64px; margin-top: -22px; }
body[data-look="line"] #readout > span { font-size: 24px; letter-spacing: .24em; padding-left: .24em; }

body[data-look="lantern"] #readout { height: 76px; margin-top: -26px; }
body[data-look="lantern"] #readout > span {
  font-size: 58px;
  font-weight: 300;
  font-variant-numeric: lining-nums tabular-nums;
  text-shadow: 0 0 28px rgb(255 170 90 / .35);
}

body[data-look="tone"] #readout { height: 88px; margin-top: -22px; }
body[data-look="tone"] #readout > span { font-size: 78px; font-weight: 300; letter-spacing: -.02em; }

/* ---- footer: history while idle, the cancel option while paused,
        the finishing time once done ---- */

footer {
  flex: none;
  display: grid;
  justify-items: center;
  align-items: end;
  height: 132px;
  padding: 0 16px 34px;
  color: var(--muted);
}
footer > section {
  grid-area: 1 / 1;
  width: min(560px, 100%);
  transition: opacity 1s var(--ease);
}
body:not([data-phase="idle"]) #history { opacity: 0; pointer-events: none; }

#pause,
#done {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  opacity: 0;
  visibility: hidden;            /* not focusable while hidden */
  transition: opacity 1s var(--ease), visibility 0s 1s;
}
body[data-phase="paused"] #pause,
body[data-phase="done"] #done {
  opacity: 1;
  visibility: visible;
  transition: opacity 1s var(--ease), visibility 0s;
}
#pause p,
#done p { margin: 0; }
#done #finished {
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

#cancel {
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  min-height: 44px;
  color: var(--ink);
  background: transparent;
  border: 1px solid transparent;
  cursor: pointer;
  transition: border-color .3s, background-color .3s;
}
#cancel:focus-visible { outline: none; }

body[data-look="line"] footer { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; }
body[data-look="line"] #cancel { padding: 0 24px; border-color: #3A3B3F; border-radius: 2px; }
body[data-look="line"] #cancel:is(:hover, :focus-visible) { border-color: var(--ink); }

body[data-look="lantern"] footer { font-size: 17px; font-style: italic; font-weight: 400; }
body[data-look="lantern"] #summary { font-size: 18px; }
body[data-look="lantern"] #cancel { padding: 0 28px; border-color: rgb(255 184 105 / .3); border-radius: 999px; font-size: 19px; }
body[data-look="lantern"] #cancel:is(:hover, :focus-visible) { border-color: #FFB869; }
body[data-look="lantern"] #done #finished { font-size: 20px; font-style: normal; font-weight: 500; }

body[data-look="tone"] footer { font-size: 13px; letter-spacing: .03em; }
body[data-look="tone"] #cancel { padding: 0 26px; border: 0; border-radius: 999px; background: rgb(0 0 0 / .18); font-weight: 500; }
body[data-look="tone"] #cancel:is(:hover, :focus-visible) { background: rgb(0 0 0 / .28); }
body[data-look="tone"] #done #finished { font-size: 15px; font-weight: 500; }

/* ---- the last 8 hours ---- */

#history { position: relative; }

#summary {
  margin: 0 0 15px;
  text-align: center;
}

#export {
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  margin-left: .6em;
  cursor: pointer;
  transition: color .3s;
}
#export::before { content: "·"; margin-right: .6em; }
#export:hover,
#export:focus-visible { outline: none; color: var(--ink); }
body[data-look="tone"] #export:is(:hover, :focus-visible) { text-decoration: underline; text-underline-offset: 3px; }
#export[hidden] { display: none; }

#track {
  position: relative;
  height: 10px;
  margin-bottom: 22px;
}
#track::before {
  content: "";
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: 1px;
  background: var(--hair);
}

.mark {
  position: absolute;
  min-width: 3px;
  transform-origin: left center;
}
.mark::after { content: ""; position: absolute; inset: -9px -3px; }  /* easier to hover */
.mark.fresh { animation: grow 1.6s .2s var(--ease) both; }
@keyframes grow {
  from { opacity: 0; transform: scaleX(0); }
}

body[data-look="line"] .mark { top: 4px; height: 3px; background: var(--ink); }
body[data-look="line"] .mark.cancelled { background: repeating-linear-gradient(90deg, var(--muted) 0 3px, transparent 3px 6px); }

body[data-look="lantern"] .mark { top: 3px; height: 4px; border-radius: 2px; background: #FFB869; box-shadow: 0 0 10px rgb(255 184 105 / .55); }
body[data-look="lantern"] .mark.cancelled { background: rgb(255 184 105 / .32); box-shadow: none; }

body[data-look="tone"] .mark { top: 2px; height: 7px; border-radius: 4px; background: var(--lit); }
body[data-look="tone"] .mark.cancelled { opacity: .4; }

.hour {
  position: absolute;
  top: 17px;
  transform: translateX(-50%);
  white-space: nowrap;
}
.hour::before {
  content: "";
  position: absolute;
  left: 50%; top: -9px;
  width: 1px; height: 4px;
  background: var(--hair);
}
.hour.now { transform: translateX(-100%); }
.hour.now::before { left: 100%; }

body[data-look="line"] .hour    { font-size: 10px; letter-spacing: .1em; }
body[data-look="lantern"] .hour { font-size: 15px; }
body[data-look="tone"] .hour    { font-size: 11px; }

#tip {
  position: absolute;
  bottom: 52px;
  left: 0;
  transform: translateX(-50%);
  padding: 6px 11px 7px;
  border-radius: 8px;
  border: 1px solid var(--hair);
  background: var(--tip);
  font-size: 12px;
  letter-spacing: .04em;
  text-transform: none;
  white-space: nowrap;
  color: var(--ink);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
body[data-look="lantern"] #tip { font-size: 15px; letter-spacing: 0; }
#tip.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  #bloom, .flicker { animation: none; }
}
</style>
</head>
<body data-phase="idle" data-look="line">
  <main>
    <svg id="flower" viewBox="-180 -180 360 360" role="group" aria-label="Focus timer">
      <defs>
        <linearGradient id="lantern-fill" gradientUnits="userSpaceOnUse" x1="0" y1="-18" x2="0" y2="-122">
          <stop offset="0" stop-color="#FF8F45"/>
          <stop offset=".6" stop-color="#FFC07A"/>
          <stop offset="1" stop-color="#FFE6BC"/>
        </linearGradient>
        <filter id="lantern-blur" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="10"/>
        </filter>
        <!-- the glow on Lantern's numbers when you point at one -->
        <filter id="ember" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
          <feFlood flood-color="#FFB869" flood-opacity=".7"/>
          <feComposite in2="blur" operator="in"/>
          <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g id="bloom">
        <g id="ghosts"></g>
        <g id="halo" filter="url(#lantern-blur)"><g class="flicker"><circle r="10"/></g></g>
        <g id="petals"></g>
        <circle id="heart"/>
      </g>
      <g id="presets"></g>
    </svg>
    <div id="readout">
      <span id="count"></span>
      <span id="time"></span>
    </div>
  </main>

  <footer>
    <section id="history">
      <p id="summary"><span id="total"></span><button id="export" type="button" title="Download every session as a .csv file" hidden>export</button></p>
      <div id="track"></div>
      <div id="tip" role="tooltip"></div>
    </section>
    <section id="pause">
      <button id="cancel" type="button">cancel</button>
      <p>paused · click anywhere to resume</p>
    </section>
    <section id="done">
      <p id="finished"></p>
      <p>click anywhere to continue</p>
    </section>
  </footer>

<script>
/* Twelve petals, one per 5-minute preset, laid out like a clock face. While a
 * session runs, the lit petals show the time that remains: each petal holds
 * five minutes and slowly closes as its minutes pass. */
(() => {
  'use strict';

  const MINUTE = 60_000;
  const SPAN_HOURS = 8;        // how far back the history strip reaches
  const SPAN = SPAN_HOURS * 60 * MINUTE;
  const LABEL_EVERY = 2;       // hours between the strip's time labels
  const STEP = 5;              // minutes per petal / preset
  const PETALS = 12;           // 5, 10 … 60
  const COUNTDOWN = 3;         // seconds of 3 · 2 · 1 before a session begins
  const MIN_LOGGED = MINUTE;   // cancelled sessions shorter than this aren't kept
  const DONE_GRACE = 600;      // ms after finishing when clicks are ignored, so one meant to pause doesn't skip the finished view
  const STORE = 'flower.sessions';

  const $ = (sel) => document.querySelector(sel);
  const NS = 'http://www.w3.org/2000/svg';
  const svg = (tag, attrs = {}) => {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  };

  const body = document.body;
  const timeEl = $('#time');
  const countEl = $('#count');
  const finishedEl = $('#finished');
  const heartEl = $('#heart');
  const petalsEl = $('#petals');
  const finishFmt = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  const faviconEl = $('#favicon');
  const themeColorEl = $('meta[name="theme-color"]');

  /* ---------- build the flower and the dial ---------- */

  const litPetals = [], haloPetals = [], ghostPetals = [], presetLabels = [];

  function wedge(deg) {
    const a0 = ((deg - 15) * Math.PI) / 180, a1 = ((deg + 15) * Math.PI) / 180;
    const r0 = 18, r1 = 178;
    const pt = (r, a) => `${(r * Math.sin(a)).toFixed(2)},${(-r * Math.cos(a)).toFixed(2)}`;
    return `M${pt(r0, a0)} L${pt(r1, a0)} A${r1},${r1} 0 0 1 ${pt(r1, a1)} L${pt(r0, a1)} A${r0},${r0} 0 0 0 ${pt(r0, a0)} Z`;
  }

  // a petal path inside a group that turns it to its place on the dial
  function placed(parent, deg, list) {
    const holder = svg('g', { transform: `rotate(${deg})` });
    const petal = svg('path', { opacity: 0 });
    holder.append(petal);
    parent.append(holder);
    list.push(petal);
  }

  for (let k = 1; k <= PETALS; k++) {
    const deg = k * 30, rad = (deg * Math.PI) / 180, minutes = k * STEP;

    const ghost = svg('path', { transform: `rotate(${deg})` });
    $('#ghosts').append(ghost);
    ghostPetals.push(ghost);

    placed(petalsEl, deg, litPetals);
    placed($('#halo .flicker'), deg, haloPetals);

    const preset = svg('g', {
      class: 'preset', tabindex: 0, role: 'button',
      'aria-label': `Focus for ${minutes} minutes`, 'data-minutes': minutes,
    });
    const label = svg('text', { x: (152 * Math.sin(rad)).toFixed(2), y: (-152 * Math.cos(rad)).toFixed(2) });
    presetLabels.push(label);
    preset.append(svg('path', { class: 'hit', d: wedge(deg) }), label);
    $('#presets').append(preset);

    const preview = (on) => () => {
      if (on) S.hover = minutes;
      else if (S.hover === minutes) S.hover = 0;
      requestRender();
    };
    preset.addEventListener('pointerenter', preview(true));
    preset.addEventListener('pointerleave', preview(false));
    preset.addEventListener('focus', preview(true));
    preset.addEventListener('blur', preview(false));
  }

  /* ---------- looks ---------- */

  // Each time the dial comes back, one of these is picked at random, a third
  // each; Tone then picks one of its four colours, a quarter each. Colours and
  // type live in the CSS under body[data-look] and body[data-palette].
  // petal(f) gives a lit petal's [scale, opacity] when f of its 5 minutes remain.
  const LOOKS = {
    line: {
      d: 'M0,-14 C14,-28 24,-102 0,-118 C-24,-102 -14,-28 0,-14 Z',
      heart: 3.2,
      label: (m) => String(m).padStart(2, '0'),
      petal: (f) => [1, f > 0.004 ? 1 : 0],
      unwinds: true,           // the outline is drawn back instead of shrinking
    },
    lantern: {
      d: 'M0,-18 C11,-36 17,-98 0,-122 C-17,-98 -11,-36 0,-18 Z',
      heart: 3.5,
      petal: (f) => [0.4 + 0.6 * f, (0.45 + 0.55 * f) * Math.min(1, f * 14)],
      halo: true,
    },
    tone: {
      d: 'M0,-15 C10,-26 19,-80 19,-98 A19,19 0 0 0 -19,-98 C-19,-80 -10,-26 0,-15 Z',
      heart: 9,
      petal: (f) => [0.34 + 0.66 * f, (0.5 + 0.5 * f) * Math.min(1, f * 14)],
      palettes: ['moss', 'clay', 'dusk', 'plum'],
    },
  };
  const pickOne = (list) => list[Math.floor(Math.random() * list.length)];

  let look, iconColors, idleIcon;   // set by newLook() at startup
  let dashLen = 0;             // Line: length of one petal's outline

  function newLook(fade) {
    const name = pickOne(Object.keys(LOOKS));
    const palette = LOOKS[name].palettes ? pickOne(LOOKS[name].palettes) : '';
    if (fade && document.startViewTransition) document.startViewTransition(() => applyLook(name, palette));
    else applyLook(name, palette);
  }

  function applyLook(name, palette) {
    look = LOOKS[name];
    body.dataset.look = name;
    if (palette) body.dataset.palette = palette;
    else delete body.dataset.palette;

    for (const p of [...ghostPetals, ...litPetals, ...haloPetals]) p.setAttribute('d', look.d);
    heartEl.setAttribute('r', look.heart);
    presetLabels.forEach((el, i) => { el.textContent = (look.label || String)((i + 1) * STEP); });
    if (look.unwinds) {
      dashLen = litPetals[0].getTotalLength();
      petalsEl.style.setProperty('--dash', (dashLen + 4).toFixed(2));
    }

    const css = getComputedStyle(body);
    const token = (v) => css.getPropertyValue(v).trim();
    iconColors = [token('--icon-a'), token('--icon-b')];
    idleIcon = flowerIcon(...iconColors);
    iconKey = '';
    themeColorEl.content = token('--bg');

    painted.fill(-1);
    updateTab(Date.now());
    requestRender();
  }

  /* ---------- state ---------- */

  const S = {
    phase: 'idle',     // idle → countdown → running ⇄ paused → done → idle
    minutes: 0,
    countdownAt: 0,    // when 3 · 2 · 1 began
    startAt: 0,        // when focus began
    pausedMs: 0,       // total time spent paused
    pauseAt: 0,
    doneAt: 0,
    beat: 0,           // countdown numeral on screen
    hover: 0,          // preset under the pointer while idle
  };

  const durationMs = () => S.minutes * MINUTE;
  const focusedMs = (now) =>
    Math.min(durationMs(), Math.max(0, (S.phase === 'paused' ? S.pauseAt : now) - S.startAt - S.pausedMs));
  const remainingMs = (now) => durationMs() - focusedMs(now);
  const active = () => S.phase === 'running' || S.phase === 'paused';

  function setPhase(phase) {
    const back = phase === 'idle' && S.phase !== 'idle';
    S.phase = phase;
    body.dataset.phase = phase;
    if (phase === 'idle') renderHistory();
    if (back) newLook(true);   // the dial comes back in a fresh look
    syncWakeLock();
    updateTab(Date.now());
    requestRender();
  }

  // Phones dim and lock after a short idle time, which would hide the dial
  // mid-session. A screen wake lock keeps the display on from the countdown
  // until you're back at the presets, so the finished view stays readable;
  // a pause, which can last indefinitely, lets the screen sleep as usual.
  // The browser drops the lock whenever the tab is hidden, so it's taken
  // again on the way back.
  let wakeLock = null, asking = false, recheck = false;
  const wantAwake = () =>
    S.phase !== 'idle' && S.phase !== 'paused' && document.visibilityState === 'visible';

  async function syncWakeLock() {
    if (!navigator.wakeLock) return;
    if (asking) { recheck = true; return; }   // settle once the pending request does
    if (wantAwake() && !wakeLock) {
      asking = true;
      try {
        const lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => { if (wakeLock === lock) wakeLock = null; });
        wakeLock = lock;
      } catch { /* refused, e.g. by battery saver: the screen sleeps as usual */ }
      asking = false;
      if (recheck) { recheck = false; syncWakeLock(); }
    } else if (!wantAwake() && wakeLock) {
      const lock = wakeLock;
      wakeLock = null;
      lock.release();
    }
  }

  function start(minutes) {
    if (S.phase !== 'idle') return;
    S.minutes = minutes;
    S.countdownAt = Date.now();
    S.beat = 0;
    S.hover = 0;
    timeEl.textContent = clock(durationMs());
    markChoice(minutes);
    document.activeElement?.blur?.();
    setPhase('countdown');
    update(S.countdownAt);
  }

  // The chosen length stays visible for the whole session as stronger petal
  // outlines. (CSS shows them only outside the idle phase.)
  function markChoice(minutes) {
    for (let i = 0; i < PETALS; i++) {
      ghostPetals[i].classList.toggle('chosen', i < minutes / STEP);
    }
  }

  function abortCountdown() {
    countEl.classList.remove('beat');
    setPhase('idle');
  }

  function pause(now) {
    S.pauseAt = now;
    setPhase('paused');
  }

  function resume(now) {
    S.pausedMs += now - S.pauseAt;
    setPhase('running');
  }

  function cancel(now) {
    const focused = focusedMs(now);
    if (focused >= MIN_LOGGED) save(record(now, focused, 'cancelled'));
    setPhase('idle');
  }

  // The finished view stays up, showing 0:00 and when time ran out, until
  // you click or press a key to go back to the presets.
  function complete() {
    const end = S.startAt + S.pausedMs + durationMs();
    S.doneAt = Date.now();
    timeEl.textContent = clock(0);
    finishedEl.textContent = `finished at ${finishFmt.format(end).toLowerCase()}`;
    save(record(end, durationMs(), 'completed'));
    setPhase('done');
  }

  function dismiss(now) {
    if (now - S.doneAt > DONE_GRACE) setPhase('idle');
  }

  const record = (end, focused, status) => ({
    start: S.startAt,
    end,
    planned_min: S.minutes,
    focused_min: +(focused / MINUTE).toFixed(2),
    status,
  });

  /* ---------- the clock: everything is derived from wall time ---------- */

  function update(now) {
    if (S.phase === 'countdown') {
      const n = COUNTDOWN - Math.floor((now - S.countdownAt) / 1000);
      if (n <= 0) {
        S.startAt = S.countdownAt + COUNTDOWN * 1000;
        S.pausedMs = 0;
        setPhase('running');
      } else if (n !== S.beat) {
        S.beat = n;
        countEl.textContent = n;
        countEl.classList.remove('beat');
        void countEl.offsetWidth; // restart the fade
        countEl.classList.add('beat');
      }
    }
    if (S.phase === 'running' && remainingMs(now) <= 0) complete();

    if (active()) setText(timeEl, clock(remainingMs(now)));
    if (S.phase === 'idle' && now - historyAt > MINUTE) renderHistory();
    updateTab(now);
  }

  // A worker's timer keeps ticking at full rate in a background tab, so the
  // tab title stays accurate even when the page itself is being throttled.
  function tick() {
    update(Date.now());
    if (S.phase === 'countdown' || active()) requestRender();
  }
  let fallbackTicker = 0;
  const tickOnMainThread = () => { fallbackTicker ||= setInterval(tick, 250); };
  try {
    const src = URL.createObjectURL(new Blob(['setInterval(() => postMessage(0), 250)'], { type: 'text/javascript' }));
    const worker = new Worker(src);
    worker.onmessage = tick;
    worker.onerror = tickOnMainThread;
  } catch {
    tickOnMainThread();
  }

  /* ---------- drawing ---------- */

  let shown = 0;       // petals currently drawn (fractional), eased toward the target
  let raf = 0, lastFrame = 0;
  const painted = new Array(PETALS).fill(-1);

  function targetPetals(now) {
    switch (S.phase) {
      case 'idle': return S.hover / STEP;
      case 'countdown': return S.minutes / STEP;
      case 'running':
      case 'paused': return remainingMs(now) / (STEP * MINUTE);
      default: return 0;
    }
  }

  function requestRender() {
    if (!raf) raf = requestAnimationFrame(frame);
  }

  function frame(t) {
    raf = 0;
    const now = Date.now();
    update(now);
    const target = targetPetals(now);
    const dt = lastFrame ? Math.min(100, t - lastFrame) : 16;
    shown += (target - shown) * (1 - Math.exp(-dt / 160));
    if (Math.abs(target - shown) < 0.002) shown = target;
    paint(shown);
    if (shown !== target || S.phase === 'countdown') {
      lastFrame = t;
      requestRender();
    } else {
      lastFrame = 0;
    }
  }

  function paint(amount) {
    for (let i = 0; i < PETALS; i++) {
      const f = Math.round(Math.min(1, Math.max(0, amount - i)) * 5000) / 5000;
      if (f === painted[i]) continue;
      painted[i] = f;
      // the petal closes as its five minutes pass, dimming a little,
      // then fades out entirely in its last moments
      const [scale, opacity] = look.petal(f);
      const tf = `scale(${scale.toFixed(4)})`, op = opacity.toFixed(4);
      const petal = litPetals[i];
      petal.setAttribute('opacity', op);
      petal.setAttribute('transform', tf);
      petal.classList.toggle('partial', f > 0 && f < 1);
      if (look.unwinds) petal.style.strokeDashoffset = (dashLen + 4 - f * dashLen).toFixed(2);
      if (look.halo) {
        haloPetals[i].setAttribute('opacity', op);
        haloPetals[i].setAttribute('transform', tf);
      }
    }
  }

  /* ---------- the browser tab ---------- */

  let lastTitle = '', lastIcon = '';
  const iconCanvas = Object.assign(document.createElement('canvas'), { width: 64, height: 64 });
  let iconKey = '', iconUrl = '';

  function flowerIcon(a, b) {
    const petals = [0, 60, 120, 180, 240, 300].map((r) => `<use href="#p" transform="rotate(${r})"/>`).join('');
    return 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="-32 -32 64 64"><defs>' +
      `<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="-4" x2="0" y2="-30"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>` +
      '<path id="p" d="M0,-4 C7,-9 11,-25 0,-30 C-11,-25 -7,-9 0,-4 Z"/>' +
      `</defs><g fill="url(#g)">${petals}</g></svg>`);
  }

  function pieIcon(fraction, paused) {
    const steps = 60, q = Math.ceil(fraction * steps);
    const key = `${q}${paused ? 'p' : ''}`;
    if (key === iconKey) return iconUrl;
    const [a, b] = iconColors;
    const alpha = paused ? 0.45 : 1;
    const c = iconCanvas.getContext('2d');
    c.clearRect(0, 0, 64, 64);
    c.globalAlpha = alpha * 0.28;
    c.beginPath();
    c.arc(32, 32, 29, 0, Math.PI * 2);
    c.fillStyle = a;
    c.fill();
    c.globalAlpha = alpha;
    if (q > 0) {
      const g = c.createLinearGradient(32, 60, 32, 4);
      g.addColorStop(0, a);
      g.addColorStop(1, b);
      c.beginPath();
      c.moveTo(32, 32);
      c.arc(32, 32, 29, -Math.PI / 2, -Math.PI / 2 + (q / steps) * Math.PI * 2);
      c.closePath();
      c.fillStyle = g;
      c.fill();
    }
    iconKey = key;
    return (iconUrl = iconCanvas.toDataURL('image/png'));
  }

  function updateTab(now) {
    let title = 'flower', icon = idleIcon;
    if (S.phase === 'countdown') {
      title = `${Math.max(1, S.beat)} · flower`;
    } else if (active()) {
      const left = remainingMs(now);
      title = `${clock(left)} · ${S.phase === 'paused' ? 'paused' : 'flower'}`;
      icon = pieIcon(left / durationMs(), S.phase === 'paused');
    } else if (S.phase === 'done') {
      title = '✓ done · flower';
    }
    if (title !== lastTitle) document.title = lastTitle = title;
    if (icon !== lastIcon) faviconEl.href = lastIcon = icon;
  }

  /* ---------- input ---------- */

  document.addEventListener('click', (e) => {
    const now = Date.now();
    switch (S.phase) {
      case 'idle': {
        const preset = e.target.closest?.('.preset');
        if (preset) start(+preset.dataset.minutes);
        else if (e.target.closest?.('#export')) exportCsv();
        break;
      }
      case 'countdown':
        if (now - S.countdownAt > 450) abortCountdown(); // ignore the second half of a double-click
        break;
      case 'running':
        pause(now);
        break;
      case 'paused':
        if (e.target.closest?.('#cancel')) cancel(now);
        else resume(now);
        break;
      case 'done':
        dismiss(now);
        break;
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.repeat || e.metaKey || e.ctrlKey || e.altKey) return;
    const now = Date.now();
    const go = e.key === ' ' || e.key === 'Enter';
    switch (S.phase) {
      case 'idle': {
        const preset = e.target.closest?.('.preset');
        if (preset && go) { e.preventDefault(); start(+preset.dataset.minutes); }
        break;
      }
      case 'countdown':
        if (e.key === 'Escape') abortCountdown();
        break;
      case 'running':
        if (go || e.key === 'Escape') { e.preventDefault(); pause(now); }
        break;
      case 'paused':
        if (e.target.closest?.('button')) return; // let the cancel button be a button
        if (go) { e.preventDefault(); resume(now); }
        else if (e.key === 'Escape') cancel(now);
        break;
      case 'done':
        if (go || e.key === 'Escape') { e.preventDefault(); dismiss(now); }
        break;
    }
  });

  // Closing the tab mid-session keeps what was done.
  addEventListener('pagehide', (e) => {
    if (e.persisted || !active()) return;
    const now = Date.now(), focused = focusedMs(now);
    if (focused >= MIN_LOGGED) addSession(record(now, focused, 'cancelled'));
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    syncWakeLock();
    requestRender();
  });

  /* ---------- sessions: kept in this browser, exportable as CSV ---------- */

  let memorySessions = [];   // used only if the browser blocks storage
  const readSessions = () => {
    try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch { return memorySessions; }
  };
  const addSession = (rec) => {
    memorySessions = [...readSessions(), rec];
    try { localStorage.setItem(STORE, JSON.stringify(memorySessions)); } catch { /* memory only */ }
  };

  function save(rec) {
    freshStart = rec.start;
    addSession(rec);
  }

  // another tab finished a session
  addEventListener('storage', (e) => {
    if (e.key === STORE && S.phase === 'idle') renderHistory();
  });

  function exportCsv() {
    const lines = ['start,end,planned_min,focused_min,status'];
    for (const s of readSessions()) {
      lines.push([isoLocal(s.start), isoLocal(s.end), s.planned_min, s.focused_min.toFixed(1), s.status].join(','));
    }
    const url = URL.createObjectURL(new Blob([lines.join('\r\n') + '\r\n'], { type: 'text/csv' }));
    const a = Object.assign(document.createElement('a'), {
      href: url,
      download: `flower-sessions-${isoLocal(Date.now()).slice(0, 10)}.csv`,
    });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  /* ---------- the last few hours ---------- */

  const track = $('#track'), total = $('#total'), exportBtn = $('#export'), tip = $('#tip');
  const hourFmt = new Intl.DateTimeFormat(undefined, { hour: 'numeric' });
  const timeFmt = new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' });
  let historyAt = 0;
  let freshStart = 0;    // the session just finished, which grows in gently

  function renderHistory() {
    const now = Date.now(), from = now - SPAN;
    historyAt = now;
    const all = readSessions();
    const list = all.filter((s) => s.end > from).sort((a, b) => a.start - b.start);
    const minutes = list.reduce((sum, s) => sum + s.focused_min, 0);
    total.textContent = list.length
      ? `${span(minutes)} in the last ${SPAN_HOURS} hours`
      : `no sessions in the last ${SPAN_HOURS} hours`;
    exportBtn.hidden = !all.length;

    const nodes = [];
    const t = new Date(from);
    t.setMinutes(60, 0, 0); // the next full hour
    for (; +t < now; t.setHours(t.getHours() + 1)) {
      const x = (t - from) / SPAN;
      if (t.getHours() % LABEL_EVERY || x > 0.92) continue;
      const label = document.createElement('span');
      label.className = 'hour';
      label.style.left = `${x * 100}%`;
      label.textContent = hourFmt.format(t).toLowerCase();
      nodes.push(label);
    }
    const nowLabel = document.createElement('span');
    nowLabel.className = 'hour now';
    nowLabel.style.left = '100%';
    nowLabel.textContent = 'now';
    nodes.push(nowLabel);

    for (const s of list) {
      const a = Math.max(s.start, from), b = Math.min(s.end, now);
      const mark = document.createElement('span');
      mark.className = `mark${s.status === 'completed' ? '' : ' cancelled'}`;
      if (freshStart && s.start === freshStart) {
        mark.classList.add('fresh');
        freshStart = 0;
      }
      mark.style.left = `${((a - from) / SPAN) * 100}%`;
      mark.style.width = `${((b - a) / SPAN) * 100}%`;
      const what = s.status === 'completed'
        ? `${s.planned_min} min`
        : `${Math.round(s.focused_min)} of ${s.planned_min} min`;
      mark.dataset.tip = `${timeFmt.formatRange(new Date(s.start), new Date(s.end))} · ${what}`;
      mark.setAttribute('aria-label', mark.dataset.tip);
      nodes.push(mark);
    }
    track.replaceChildren(...nodes);
  }

  track.addEventListener('pointerover', (e) => {
    const mark = e.target.closest('.mark');
    if (!mark) return;
    tip.textContent = mark.dataset.tip;
    const box = track.getBoundingClientRect(), m = mark.getBoundingClientRect();
    const half = tip.offsetWidth / 2;
    const x = Math.min(box.width - half, Math.max(half, m.left + m.width / 2 - box.left));
    tip.style.left = `${x}px`;
    tip.classList.add('show');
  });
  track.addEventListener('pointerout', (e) => {
    if (!e.relatedTarget?.closest?.('.mark')) tip.classList.remove('show');
  });

  /* ---------- formatting ---------- */

  function clock(ms) {
    const s = Math.ceil(ms / 1000);
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  }

  function span(minutes) {
    const m = Math.round(minutes);
    if (m < 60) return `${m} min`;
    const h = Math.floor(m / 60), r = m % 60;
    return r ? `${h} h ${r} min` : `${h} h`;
  }

  // local time with its UTC offset, e.g. 2026-11-06T14:05:12-07:00
  function isoLocal(ms) {
    const d = new Date(ms), off = -d.getTimezoneOffset();
    const p = (n) => String(Math.abs(n)).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}` +
      `T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}` +
      `${off < 0 ? '-' : '+'}${p(Math.trunc(off / 60))}:${p(off % 60)}`;
  }

  function setText(el, text) {
    if (el.textContent !== text) el.textContent = text;
  }

  /* ---------- go ---------- */

  newLook(false);
  renderHistory();
  requestRender();
})();
</script>
</body>
</html>
